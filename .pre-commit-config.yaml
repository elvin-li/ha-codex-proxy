repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # Lint (fix auto-fixable issues in place)
      - id: ruff
        args: [--fix]
        files: ^(custom_components/codex_proxy|tests)/
      # Format
      - id: ruff-format
        files: ^(custom_components/codex_proxy|tests)/
