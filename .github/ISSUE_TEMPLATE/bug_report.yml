name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [troubleshooting section](https://github.com/elvin-li/ha-codex-proxy#故障排查) in the README and search existing issues.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2025.6.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Codex Token Pool version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Devices & Services
        2. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant HA log output
      description: |
        Enable debug logging first:
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.codex_proxy: debug
        ```
        Then paste the relevant lines here.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional but helpful)
      description: |
        Settings → Devices & Services → Codex Token Pool → Download diagnostics.
        The API key is automatically redacted.
      render: json

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I confirmed the proxy works with the smoke test from the README
          required: false
